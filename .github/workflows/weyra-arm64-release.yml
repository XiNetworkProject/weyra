name: Weyra ARM64 release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weyra-arm64-main
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WEYRA_RADAR_MAINTENANCE_MODE: external
      FORMAT_BASE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting check
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript check
        run: pnpm run check

      - name: Unit tests and coverage
        run: pnpm run test:coverage

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: API and browser smoke tests
        run: pnpm run test:e2e

      - name: Production PWA install and offline test
        run: pnpm run test:e2e:pwa-production

  build:
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WEYRA_RADAR_MAINTENANCE_MODE: external

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the official Météo-France BUFR decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev
          bash radar-worker/build_meteofrance_decoder.sh
          test -x radar-worker/bin/decode_meteofrance_bufr

      - name: TypeScript check
        run: pnpm run check

      - name: Build production application and worker
        run: pnpm run build:production

      - name: Validate Python sources
        run: python3 -m py_compile radar-worker/*.py

      - name: Configure Python for radar validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar-worker/requirements.txt

      - name: Verify radar composition and reprojection
        run: |
          python -m pip install -r radar-worker/requirements.txt
          python -m unittest discover -s radar-worker -p 'test_*.py' -v

      - name: Assemble standalone release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/.next/static release/dist
          cp -a .next/standalone/. release/
          cp -a .next/static/. release/.next/static/
          cp -a public release/public
          mkdir -p release/radar-worker
          cp -a radar-worker/. release/radar-worker/
          cp dist/radar-worker.mjs release/dist/radar-worker.mjs
          printf '{"commit":"%s","builtAt":"%s","platform":"linux-arm64"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/release.json
          cp release/release.json weyra-release.json
          tar -C release -czf weyra-linux-arm64.tar.gz .
          sha256sum weyra-linux-arm64.tar.gz > weyra-linux-arm64.tar.gz.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: weyra-linux-arm64-${{ github.sha }}
          path: |
            weyra-linux-arm64.tar.gz
            weyra-linux-arm64.tar.gz.sha256
            weyra-release.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish edge release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view weyra-edge >/dev/null 2>&1; then
            gh release edit weyra-edge \
              --target "$GITHUB_SHA" \
              --title "Weyra deployable ARM64"
          else
            gh release create weyra-edge \
              --target "$GITHUB_SHA" \
              --title "Weyra deployable ARM64" \
              --notes "Artifact generated from the latest validated main commit." \
              --prerelease
          fi
          gh release upload weyra-edge \
            weyra-linux-arm64.tar.gz \
            weyra-linux-arm64.tar.gz.sha256 \
            --clobber
          gh release upload weyra-edge weyra-release.json --clobber
