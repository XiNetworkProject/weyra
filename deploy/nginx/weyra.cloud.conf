limit_req_zone $binary_remote_addr zone=weyra_prewarm:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=weyra_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name weyra.cloud www.weyra.cloud;
    return 301 https://weyra.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.weyra.cloud;

    ssl_certificate /etc/letsencrypt/live/weyra.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weyra.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://weyra.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weyra.cloud;

    ssl_certificate /etc/letsencrypt/live/weyra.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weyra.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/radar/opera/packs/maintenance { return 404; }
    location = /api/radar/opera/frames { return 404; }
    location = /api/radar/opera/latest { return 404; }
    location ^~ /api/radar/opera/qa { return 404; }
    location ^~ /api/radar/opera/render { return 404; }
    location ^~ /api/radar/opera/tiles/ { return 404; }
    location ^~ /radar-lab { return 404; }

    location = /api/radar/opera/tiles/prewarm {
        limit_req zone=weyra_prewarm burst=2 nodelay;
        limit_conn weyra_per_ip 1;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
